[package]
name = "haku"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
form_urlencoded = "1"
hyper = { version = "0.14", features = ["client", "http1", "http2", "server", "tcp"] }
hyper-rustls = { version = "0.24", features = ["webpki-roots", "http1", "http2"] }
indicatif = "0.18.6"
lru = "0.12"
parking_lot = "0.12"
mio = { version = "0.8", features = ["os-poll", "net"] }
rust-stemmers = "1"
serde_json = "1"
unicode-segmentation = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
criterion = "0.5"
rand = "=0.9.5"
tempfile = "3"

[[bench]]
name = "bm25"
harness = false
